name: Build PDF Validator (Windows)

on:
  push:
    paths:
      - "rag-server/validator/**"
      - "rag-server/vcpkg.json"
      - ".github/workflows/validator-windows.yml"
  pull_request:
    paths:
      - "rag-server/validator/**"
      - "rag-server/vcpkg.json"
      - ".github/workflows/validator-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: 1

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:/vcpkg
          if ($LASTEXITCODE -ne 0) { throw "Could not clone vcpkg." }
          git -C C:/vcpkg checkout e6d62cc9ce8f8d9687df14521118f2ec3c10ee6a
          if ($LASTEXITCODE -ne 0) { throw "Could not check out the pinned vcpkg baseline." }
          & C:/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed." }

      - name: Configure MSVC x64 build and install dependencies
        shell: pwsh
        run: |
          cmake -S rag-server/validator -B C:/bld/rag-validator -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_MANIFEST_DIR="$env:GITHUB_WORKSPACE/rag-server" -DVCPKG_INSTALLED_DIR=C:/vcpkg_installed -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_MANIFEST_INSTALL=ON
          if ($LASTEXITCODE -ne 0) { throw "MSVC CMake configuration or vcpkg dependency installation failed." }

      - name: Build validator
        shell: pwsh
        run: |
          cmake --build C:/bld/rag-validator --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Validator compilation failed." }

      - name: Prepare C++ library package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $library = "C:/bld/rag-validator/Release/rag_validator.lib"
          $output = "rag-server/validator/output"
          if (!(Test-Path $library)) { throw "Validator library was not produced: $library" }
          if (Test-Path $output) { Remove-Item $output -Recurse -Force }
          New-Item -ItemType Directory -Path "$output/include/validator/config", "$output/lib" -Force | Out-Null
          Copy-Item $library "$output/lib/"
          Copy-Item rag-server/validator/*.hpp "$output/include/validator/"
          Copy-Item rag-server/validator/config/*.hpp "$output/include/validator/config/"
          @"
          RAG PDF Validator - Windows x64 MSVC library

          This is a static MSVC library, not a standalone executable.
          It was built with the pinned vcpkg Poppler dependency. Consumers
          must use a compatible MSVC toolchain and link the matching Poppler
          C++ library and its transitive dependencies.
          "@ | Set-Content "$output/README-LIBRARY.txt" -Encoding UTF8
          if (!(Test-Path "$output/lib/rag_validator.lib")) { throw "Validator packaging failed." }

      - name: Upload validator library package
        uses: actions/upload-artifact@v4
        with:
          name: validator-windows-x64-library
          path: rag-server/validator/output/
          if-no-files-found: error
          retention-days: 14
