name: Build BGE-M3 Embedding Service (Windows)

on:
  push:
    paths:
      - "rag-server/embedding-service/**"
      - ".github/workflows/embedding-service-windows.yml"
  pull_request:
    paths:
      - "rag-server/embedding-service/**"
      - ".github/workflows/embedding-service-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust build toolchain
        uses: dtolnay/rust-toolchain@stable

      # Rust procedural-macro linking under MSVC can exceed Windows path
      # limits when Cargo's target directory is nested under the repository.
      # Keep all generated build paths short and predictable.
      - name: Configure embedding service
        shell: pwsh
        run: |
          cmake -S rag-server/embedding-service -B C:/bld -A x64 -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed." }

      - name: Build embedding service
        shell: pwsh
        run: |
          cmake --build C:/bld --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Embedding service compilation failed." }

      - name: Verify build outputs
        shell: pwsh
        run: |
          $library = "C:/bld/Release/rag_embedding_service.lib"
          $runtime = "C:/bld/_deps/onnxruntime/microsoft.ml.onnxruntime.1.32.0/runtimes/win-x64/native/onnxruntime.dll"

          if (!(Test-Path $library)) {
            throw "Embedding service library was not produced: $library"
          }
          if (!(Test-Path $runtime)) {
            throw "ONNX Runtime DLL was not found: $runtime"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rag-embedding-service-windows-x64
          path: |
            C:/bld/Release/rag_embedding_service.lib
            C:/bld/_deps/onnxruntime/microsoft.ml.onnxruntime.1.32.0/runtimes/win-x64/native/onnxruntime.dll
          if-no-files-found: error
          retention-days: 14
