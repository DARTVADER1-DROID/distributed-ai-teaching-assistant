name: Build RAG Pipeline Test (Windows)

on:
  push:
    paths:
      - "rag-server/validator/**"
      - "rag-server/extractor/**"
      - "rag-server/chunker/**"
      - "rag-server/embedding-service/**"
      - "rag-server/config/**"
      - "rag-server/pipeline-test/**"
      - ".github/workflows/pipeline-test-windows.yml"
  pull_request:
    paths:
      - "rag-server/validator/**"
      - "rag-server/extractor/**"
      - "rag-server/chunker/**"
      - "rag-server/embedding-service/**"
      - "rag-server/config/**"
      - "rag-server/pipeline-test/**"
      - ".github/workflows/pipeline-test-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 and install build dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-tools-git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-poppler
            mingw-w64-x86_64-poppler-data
            mingw-w64-x86_64-pkgconf

      - name: Configure
        run: >-
          cmake -S rag-server/pipeline-test
          -B C:/bld/rag-pipeline
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build C:/bld/rag-pipeline --parallel

      - name: Package executable and runtime resources
        run: |
          set -euo pipefail
          exe="/c/bld/rag-pipeline/rag_pipeline_test.exe"
          output="rag-server/pipeline-test/output"
          test -s "$exe"
          rm -rf "$output"
          mkdir -p "$output"
          cp "$exe" "$output/"
          test -s "/c/bld/rag-pipeline/onnxruntime.dll"
          cp "/c/bld/rag-pipeline/onnxruntime.dll" "$output/"

          # Bundle MinGW and Poppler DLL dependencies beside the executable.
          ldd "$exe" | awk '/=>/ { print $3 } /^\// { print $1 }' |
            grep '^/mingw64/bin/.*\.dll$' |
            sort -u |
            while IFS= read -r dll; do
              test -f "$dll"
              cp -u "$dll" "$output/"
            done

          # Poppler is built as relocatable by MSYS2. Its runtime data lookup
          # resolves this directory relative to the Poppler DLL location.
          poppler_data="/mingw64/share/poppler"
          test -d "$poppler_data"
          test -d "$poppler_data/cMap"
          test -d "$poppler_data/cidToUnicode"
          test -d "$poppler_data/nameToUnicode"
          test -d "$poppler_data/unicodeMap"
          mkdir -p "$output/share"
          cp -a "$poppler_data" "$output/share/"

          cat > "$output/README.txt" <<'EOF'
          RAG Validator + Extractor + Chunker Pipeline Test (Windows x64)

          1. Extract this entire folder.
          2. Open Command Prompt or PowerShell in this folder.
          3. Run:
             .\rag_pipeline_test.exe "C:\full\path\to\your-document.pdf" \
               "C:\path\to\bge-m3\model.onnx" \
               "C:\path\to\bge-m3\tokenizer.json"

          Keep model.onnx_data beside model.onnx if the ONNX export uses that
          external-weight file. The ONNX Runtime DLL is included in this package.

          The program validates the PDF, extracts its hierarchy, creates
          structure-aware chunks using the BGE-M3 tokenizer, and prints each
          chunk's source range, embedding input, token count, dense vector,
          vector dimensions, normalization check, and stage timings.

          The BGE-M3 model and tokenizer are not included in this test artifact.
          Supply the local model and tokenizer paths as the second and third
          command-line arguments. No runtime network access is performed.

          Keep the DLL files and the share\poppler data directory in their
          original locations beside the EXE. Do not move the EXE by itself.

          Exit code 0 = validation, extraction, and chunking passed.
          Exit code 1 = validation or extraction failed.
          Exit code 2 = invalid command line or input file read failure.
          EOF

          test -s "$output/rag_pipeline_test.exe"
          test -s "$output/README.txt"
          test -d "$output/share/poppler/cMap"
          test -d "$output/share/poppler/cidToUnicode"
          test -d "$output/share/poppler/nameToUnicode"
          test -d "$output/share/poppler/unicodeMap"

      - name: Upload runnable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: rag-pipeline-test-windows-x64
          path: rag-server/pipeline-test/output/
          if-no-files-found: error
          retention-days: 14
