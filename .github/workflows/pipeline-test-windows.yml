name: Build RAG Pipeline Test (Windows)

on:
  push:
    paths:
      - "rag-server/validator/**"
      - "rag-server/extractor/**"
      - "rag-server/chunker/**"
      - "rag-server/embedding-service/**"
      - "rag-server/config/**"
      - "rag-server/pipeline-test/**"
      - "rag-server/vcpkg.json"
      - ".github/workflows/pipeline-test-windows.yml"
  pull_request:
    paths:
      - "rag-server/validator/**"
      - "rag-server/extractor/**"
      - "rag-server/chunker/**"
      - "rag-server/embedding-service/**"
      - "rag-server/config/**"
      - "rag-server/pipeline-test/**"
      - "rag-server/vcpkg.json"
      - ".github/workflows/pipeline-test-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: 1

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust build toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up pinned vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:/vcpkg-rag
          if ($LASTEXITCODE -ne 0) { throw "Could not clone vcpkg." }

          git -C C:/vcpkg-rag checkout e6d62cc9ce8f8d9687df14521118f2ec3c10ee6a
          if ($LASTEXITCODE -ne 0) { throw "Could not check out the pinned vcpkg baseline." }

          & C:/vcpkg-rag/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed." }

      - name: Configure MSVC x64 build and install dependencies
        shell: pwsh
        run: |
          cmake -S rag-server/pipeline-test -B C:/bld/rag-pipeline -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg-rag/scripts/buildsystems/vcpkg.cmake -DVCPKG_MANIFEST_DIR="$env:GITHUB_WORKSPACE/rag-server" -DVCPKG_INSTALLED_DIR=C:/vcpkg-rag_installed -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_MANIFEST_INSTALL=ON
          if ($LASTEXITCODE -ne 0) { throw "MSVC CMake configuration or vcpkg dependency installation failed." }

      - name: Build executable
        shell: pwsh
        run: |
          cmake --build C:/bld/rag-pipeline --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "RAG pipeline compilation failed." }

      - name: Package runnable Windows test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "C:/bld/rag-pipeline/Release/rag_pipeline_test.exe"
          $output = "rag-server/pipeline-test/output"
          $vcpkgBin = "C:/vcpkg-rag_installed/x64-windows/bin"
          $onnxRuntime = "C:/bld/rag-pipeline/embedding-service/_deps/onnxruntime/microsoft.ml.onnxruntime.1.32.0/runtimes/win-x64/native/onnxruntime.dll"

          if (!(Test-Path $exe)) { throw "Pipeline executable was not produced: $exe" }
          if (!(Test-Path $onnxRuntime)) { throw "ONNX Runtime DLL was not found: $onnxRuntime" }
          if (!(Test-Path $vcpkgBin)) { throw "vcpkg runtime directory was not found: $vcpkgBin" }

          if (Test-Path $output) { Remove-Item $output -Recurse -Force }
          New-Item -ItemType Directory -Path $output -Force | Out-Null

          Copy-Item $exe $output
          Copy-Item $onnxRuntime $output
          Get-ChildItem $vcpkgBin -Filter "*.dll" -File | Copy-Item -Destination $output -Force

          @"
          RAG Validator + Extractor + Chunker + Embedding Pipeline Test (Windows x64)

          Run from this extracted folder:
            .\rag_pipeline_test.exe "C:\full\path\to\document.pdf" "C:\path\to\model.onnx" "C:\path\to\tokenizer.json"

          Keep model.onnx external-weight files beside model.onnx using their
          exact exported filenames. The ONNX Runtime DLL and vcpkg runtime DLLs
          required by this build are included beside the executable.

          The BGE-M3 model and tokenizer are not included. Supply local files;
          runtime inference and tokenization do not require network access.

          This is a CI test package, not yet the final single-file installer.
          "@ | Set-Content "$output/README.txt" -Encoding UTF8

          if (!(Test-Path "$output/rag_pipeline_test.exe")) { throw "Executable packaging failed." }
          if (!(Test-Path "$output/onnxruntime.dll")) { throw "ONNX Runtime packaging failed." }

      - name: Upload runnable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: rag-pipeline-test-windows-x64
          path: rag-server/pipeline-test/output/
          if-no-files-found: error
          retention-days: 14
