name: Build PDF Extractor (Windows)

on:
  push:
    paths:
      - "rag-server/extractor/**"
      - "rag-server/config/**"
      - "rag-server/vcpkg.json"
      - ".github/workflows/extractor-windows.yml"
  pull_request:
    paths:
      - "rag-server/extractor/**"
      - "rag-server/config/**"
      - "rag-server/vcpkg.json"
      - ".github/workflows/extractor-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: 1

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pinned vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:/vcpkg-rag
          if ($LASTEXITCODE -ne 0) { throw "Could not clone vcpkg." }
          git -C C:/vcpkg-rag checkout e6d62cc9ce8f8d9687df14521118f2ec3c10ee6a
          if ($LASTEXITCODE -ne 0) { throw "Could not check out the pinned vcpkg baseline." }
          & C:/vcpkg-rag/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed." }

      - name: Configure MSVC x64 build and install dependencies
        shell: pwsh
        run: |
          cmake -S rag-server/extractor -B C:/bld/rag-extractor -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg-rag/scripts/buildsystems/vcpkg.cmake -DVCPKG_MANIFEST_DIR="$env:GITHUB_WORKSPACE/rag-server" -DVCPKG_INSTALLED_DIR=C:/vcpkg-rag_installed -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_MANIFEST_INSTALL=ON
          if ($LASTEXITCODE -ne 0) { throw "MSVC CMake configuration or vcpkg dependency installation failed." }

      - name: Build extractor
        shell: pwsh
        run: |
          cmake --build C:/bld/rag-extractor --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Extractor compilation failed." }

      - name: Prepare C++ library package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $library = "C:/bld/rag-extractor/Release/rag_extractor.lib"
          $output = "rag-server/extractor/output"
          if (!(Test-Path $library)) { throw "Extractor library was not produced: $library" }
          if (Test-Path $output) { Remove-Item $output -Recurse -Force }
          New-Item -ItemType Directory -Path "$output/include/extractor", "$output/include/config", "$output/lib" -Force | Out-Null
          Copy-Item rag-server/extractor/extractor_service.hpp "$output/include/extractor/"
          Copy-Item rag-server/config/document_format_config.hpp "$output/include/config/"
          Copy-Item $library "$output/lib/"
          @"
          RAG PDF Extractor - Windows x64 MSVC library

          This is a static MSVC library, not a standalone executable.
          It was built with the pinned vcpkg Poppler dependency. Consumers
          must use a compatible MSVC toolchain and link the matching Poppler
          C++ library and its transitive dependencies.
          "@ | Set-Content "$output/README-LIBRARY.txt" -Encoding UTF8
          if (!(Test-Path "$output/lib/rag_extractor.lib")) { throw "Extractor packaging failed." }
          if (!(Test-Path "$output/include/extractor/extractor_service.hpp")) { throw "Extractor headers were not packaged." }
          if (!(Test-Path "$output/include/config/document_format_config.hpp")) { throw "Configuration headers were not packaged." }

      - name: Upload extractor library package
        uses: actions/upload-artifact@v4
        with:
          name: extractor-windows-x64-library
          path: rag-server/extractor/output/
          if-no-files-found: error
          retention-days: 14
